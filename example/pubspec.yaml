name: example
description: "SoFluffy Design System widgetbook"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  design_system:
    path: ../

  widgetbook: ^3.17.0
  widgetbook_annotation: ^3.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  widgetbook_generator: ^3.17.0
  build_runner: ^2.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/themes/

