name: sofluffy_ui

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  shimmer: ^3.0.0
  flutter_svg: ^2.1.0
  dough: ^2.0.0
  table_calendar: ^3.2.0
  flash: ^3.1.1
  flutter_widget_from_html_core: ^0.17.0

  easy_debounce: ^2.0.3

dev_dependencies:
  build_runner:
  flutter_gen_runner:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/
  integrations:
    image: false
    flutter_svg: false
    rive: false
    lottie: false
