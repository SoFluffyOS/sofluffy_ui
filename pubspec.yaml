name: sofluffy_ui
description: A fluffy and customizable UI package for Flutter app across all platforms.
version: 1.0.0
repository: https://github.com/SoFluffyOS/sofluffy_ui
issue_tracker: https://github.com/SoFluffyOS/lumide/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A%20sofluffy_ui%22

topics:
  - ui
  - widgets
  - sofluffy

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  shimmer: ^3.0.0
  flutter_svg: ^2.1.0
  dough: ^2.0.0
  table_calendar: ^3.2.0
  flash: ^3.1.1
  flutter_widget_from_html_core: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/
  integrations:
    image: false
    flutter_svg: false
    rive: false
    lottie: false
